server {
  listen 8082;
  server_name _;

  root /opt/flesh-is-weak-seminar/site;
  index index.html;

  # VitePress emits small inline bootstrap scripts, so script-src needs unsafe-inline
  # unless a nonce/hash pipeline is added later.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  location /api/ {
    proxy_pass http://127.0.0.1:18082;
    proxy_http_version 1.1;
    # Preserve the public port so backend Origin validation sees 43.156.92.245:8082.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 16k;
  }

  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }
}
