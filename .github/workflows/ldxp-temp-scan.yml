name: Temporary LDXP Live Scan
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temporary-ldxp-live-scan
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and tune scanner
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/daleselaji-dev/-/main/ldxp_live_scan.py' -o /tmp/ldxp_live_scan.py
          sed -i "s/retries=3/retries=1/; s/timeout=30/timeout=10/; s/max_workers=4/max_workers=12/" /tmp/ldxp_live_scan.py
      - name: Scan live inventory
        env:
          TZ: Asia/Singapore
        run: python /tmp/ldxp_live_scan.py
      - name: Commit scan output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/latest.json results/latest.md
          git diff --cached --quiet || git commit -m 'chore: temporary LDXP live result [skip ci]'
          git pull --rebase
          git push
