name: Temporary LDXP Live Scan
on:
  workflow_dispatch:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  scan:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[LDXP-LIVE-SCAN]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download scanner
        run: curl -fsSL 'https://raw.githubusercontent.com/daleselaji-dev/-/main/ldxp_live_scan.py' -o /tmp/ldxp_live_scan.py
      - name: Scan live inventory
        env:
          TZ: Asia/Singapore
        run: python /tmp/ldxp_live_scan.py
      - name: Commit scan output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/latest.json results/latest.md
          git diff --cached --quiet || git commit -m 'chore: temporary LDXP live result [skip ci]'
          git push
      - name: Close trigger issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment 'Live scan completed.'
